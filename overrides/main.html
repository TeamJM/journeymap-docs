{% extends "base.html" %}

{% block outdated %}
  You're not viewing the latest version.
  <a href="{{ '../' ~ base_url }}"> 
    <strong>Click here to go to latest.</strong>
  </a>
{% endblock %}

{% block extrahead %}
<script>
  (function() {
    const baseDir = '/journeymap-docs/';
    const isRoot = window.location.pathname === baseDir || 
                   window.location.pathname === baseDir + 'index.html';

    const getAvailableLangs = () => {
      const selectors = document.querySelectorAll('link[hreflang], a[hreflang]');
      return Array.from(selectors)
                  .map(el => el.getAttribute('hreflang'))
                  .filter(lang => lang && lang !== 'x-default');
    };

    if (isRoot) {
      const availableLangs = getAvailableLangs();
      const savedLang = localStorage.getItem('jm_docs_lang');
      const browserLang = navigator.language || navigator.userLanguage;
      
      let targetLang = savedLang || browserLang;
      let finalMatch = null;

      finalMatch = availableLangs.find(l => l.toLowerCase() === targetLang.toLowerCase());

      if (!finalMatch) {
        const short = targetLang.split('-')[0].toLowerCase();
        finalMatch = availableLangs.find(l => l.toLowerCase() === short);
      }

      if (finalMatch && finalMatch !== 'en') {
        window.location.replace(baseDir + finalMatch + '/');
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const langLinks = document.querySelectorAll('.md-select__link, [hreflang]');
      langLinks.forEach(link => {
        link.addEventListener('click', function() {
          const newLang = this.getAttribute('hreflang');
          if (newLang) {
            localStorage.setItem('jm_docs_lang', newLang);
          }
        });
      });
    });
  })();
</script>
{% endblock %}
